; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_raw = yes
monitor_speed = 115200
; If peach-pit.local doesn't resolve, use the IP shown on the OLED / by the
; 'ip' command instead, e.g. `pio device monitor --port socket://<ip>:6666`
; and `pio run -t upload --upload-port <ip>`.
monitor_port = socket://peach-pit.local:6666
build_flags = -Isrc/drivers -DCORE_DEBUG_LEVEL=4 -DLOG_LOCAL_LEVEL=4
build_src_filter = +<*> -<main_hbridge_test.cpp>
upload_protocol = espota
upload_port = peach-pit.local
lib_deps = 
	olikraus/U8g2 @ ^2.34.22
	janelia-arduino/TMC2209
	adafruit/Adafruit seesaw Library@^1.7.9

[env:hbridge_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_raw = yes
upload_protocol = esptool
build_src_filter = -<*> +<main_hbridge_test.cpp>
